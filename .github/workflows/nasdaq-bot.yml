name: Nasdaq Bot

on:
  schedule:
    - cron: "0 13 * * 1-5"   # TR 16:00 - piyasa açılmadan önce tarama
    - cron: "0 15 * * 1-5"   # TR 18:00 - açılıştan sonra kırılım kontrolü
  workflow_dispatch:
    inputs:
      test:
        description: "Sadece test mesajı gönder"
        type: boolean
        default: false
      intraday:
        description: "Kırılım kontrolünü çalıştır"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: nasdaq-bot

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python bot.py
        env:
          TEST: ${{ inputs.test }}
          INTRADAY: ${{ inputs.intraday }}
          SCHEDULE: ${{ github.event.schedule }}
      - name: Durumu kaydet
        run: |
          git config user.name "nasdaq-bot"
          git config user.email "bot@users.noreply.github.com"
          if [ -f state.json ]; then git add state.json; fi
          git diff --staged --quiet || (git commit -m "state" && git push)
