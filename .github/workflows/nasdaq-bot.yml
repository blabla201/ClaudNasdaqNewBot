name: Nasdaq Bot

on:
  schedule:
    - cron: "0 13 * * 1-5"
  workflow_dispatch:
    inputs:
      test:
        description: "Sadece test mesajı gönder"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python bot.py
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TEST: ${{ inputs.test }}
      - name: Durumu kaydet
        run: |
          git config user.name "nasdaq-bot"
          git config user.email "bot@users.noreply.github.com"
          if [ -f state.json ]; then git add state.json; fi
          git diff --staged --quiet || (git commit -m "state" && git push)
